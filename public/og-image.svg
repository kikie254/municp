<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#041F14"/>
  
  <!-- Pattern overlay -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#F3AD42" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Gold accent bar -->
  <rect y="0" width="8" height="630" fill="#F3AD42"/>
  
  <!-- Content area -->
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5px">
    <tspan x="80" dy="0">ITEN-TAMBACH</tspan>
    <tspan x="80" dy="90">MUNICIPALITY</tspan>
  </text>
  
  <text x="80" y="400" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#F3AD42">
    County Government of Elgeyo Marakwet
  </text>
  
  <text x="80" y="460" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.7)">
    Municipal Services · Public Participation · Official Documents
  </text>
  
  <!-- Footer text -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2px">
    REPUBLIC OF KENYA
  </text>
</svg>
